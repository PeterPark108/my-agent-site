# MẪU — thêm vào server{} của myagentvn.com (HTTPS 443). KHÔNG đổi cấu hình cổng 80.
# Ở khối http{}:  limit_req_zone $binary_remote_addr zone=contact:10m rate=6r/m;
location = /api/contact {
    limit_except POST OPTIONS { deny all; }
    limit_req zone=contact burst=3 nodelay;
    limit_req_status 429;
    client_max_body_size 16k;
    proxy_pass http://127.0.0.1:8787;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_connect_timeout 3s;
    proxy_read_timeout 6s;   # front-end chờ tối đa 5s
}
location = /api/contact/health { allow 127.0.0.1; deny all; proxy_pass http://127.0.0.1:8787; }
